# YOLOv5s-only: NPU 上只跑 yolov5s (COCO person=class 0) 一个模型.
# 默认关闭快照/BGR 转换，只保留零拷贝检测 + IoU 跟踪；
# 需要本地抓拍时设 keep_source_bgr=true、enable_snapshot=true。
input_mode=rtsp
enable_tracking=true
yolo_model=models/yolov5s_relu_pt.rknn
conf_thres=0.35
iou_thres=0.45
keep_source_bgr=false
enable_snapshot=false
target_fps=10
npu_workers=12
yolo_core_mask=rotate

channels.list=cam0,cam1,cam2,cam3,cam4,cam5,cam6,cam7,cam8,cam9
channel.cam0.stream_url=rtsp://127.0.0.1:8554/live/0
channel.cam1.stream_url=rtsp://127.0.0.1:8555/live/1
channel.cam2.stream_url=rtsp://127.0.0.1:8556/live/2
channel.cam3.stream_url=rtsp://127.0.0.1:8557/live/3
channel.cam4.stream_url=rtsp://127.0.0.1:8558/live/4
channel.cam5.stream_url=rtsp://127.0.0.1:8559/live/5
channel.cam6.stream_url=rtsp://127.0.0.1:8560/live/6
channel.cam7.stream_url=rtsp://127.0.0.1:8561/live/7
channel.cam8.stream_url=rtsp://127.0.0.1:8562/live/8
channel.cam9.stream_url=rtsp://127.0.0.1:8563/live/9
